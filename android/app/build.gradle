apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: 'com.google.gms.google-services'
project.ext.vectoricons = [
    iconFontNames: [ 'MaterialIcons.ttf', 'Ionicons.ttf', 'MaterialCommunityIcons.ttf' ]
]
apply from: "../../node_modules/react-native-vector-icons/fonts.gradle"

react {
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = true
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "yaro.vc.app"

    defaultConfig {
        applicationId "yaro.vc.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2
        versionName "0.0.2"
        missingDimensionStrategy "store", "play"
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
        externalNativeBuild {
            cmake {
                arguments "-DCMAKE_SHARED_LINKER_FLAGS=-Wl,-z,max-page-size=16384 -Wl,-z,common-page-size=16384",
                          "-DCMAKE_MODULE_LINKER_FLAGS=-Wl,-z,max-page-size=16384 -Wl,-z,common-page-size=16384",
                          "-DCMAKE_EXE_LINKER_FLAGS=-Wl,-z,max-page-size=16384 -Wl,-z,common-page-size=16384",
                          "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON",
                          "-DCMAKE_BUILD_PARALLEL_LEVEL=1",
                          "-DCMAKE_JOB_POOLS=compile=1;link=1",
                          "-DCMAKE_JOB_POOL_COMPILE=compile",
                          "-DCMAKE_JOB_POOL_LINK=link"
            }
        }
    }

    splits {
        abi {
            reset()
            enable false
            include "armeabi-v7a", "arm64-v8a"
            universalApk false
        }
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            def localProps = new Properties()
            def localPropsFile = rootProject.file('local.properties')
            if (localPropsFile.exists()) {
                localProps.load(new FileInputStream(localPropsFile))
            }

            def storeFileName = System.getenv("MYAPP_UPLOAD_STORE_FILE") ?: (project.findProperty("MYAPP_UPLOAD_STORE_FILE") ?: localProps.getProperty("MYAPP_UPLOAD_STORE_FILE", "yaro-upload-key.keystore"))
            def keyAliasVal = System.getenv("MYAPP_UPLOAD_KEY_ALIAS") ?: (project.findProperty("MYAPP_UPLOAD_KEY_ALIAS") ?: localProps.getProperty("MYAPP_UPLOAD_KEY_ALIAS", "yaro-upload-key"))
            def storePasswordVal = System.getenv("MYAPP_UPLOAD_STORE_PASSWORD") ?: (project.findProperty("MYAPP_UPLOAD_STORE_PASSWORD") ?: localProps.getProperty("MYAPP_UPLOAD_STORE_PASSWORD", ""))
            def keyPasswordVal = System.getenv("MYAPP_UPLOAD_KEY_PASSWORD") ?: (project.findProperty("MYAPP_UPLOAD_KEY_PASSWORD") ?: localProps.getProperty("MYAPP_UPLOAD_KEY_PASSWORD", ""))

            if (file(storeFileName).exists() && storePasswordVal && keyPasswordVal) {
                storeFile file(storeFileName)
                storePassword storePasswordVal
                keyAlias keyAliasVal
                keyPassword keyPasswordVal
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    // ✅ FORCE ONLY ONE AGORA SDK (IMPORTANT)
    implementation('io.agora.rtc:voice-sdk:4.6.2')
    // React Native Agora's Java bridge requires the standard Iris wrapper;
    // the media engine itself remains the much smaller voice SDK above.
    implementation('io.agora.rtc:iris-rtc:4.6.2-build.1')
    implementation('com.gitee.hljdrl:svgaplayer-android:2.6.8.0')

    // Play Integrity API for Firebase Phone Authentication
    implementation('com.google.android.play:integrity:1.4.0')

    // Animated gift formats rendered by React Native Image/Fresco.
    implementation('com.facebook.fresco:animated-gif:3.6.0')
    implementation('com.facebook.fresco:animated-webp:3.6.0')
    implementation('com.facebook.fresco:webpsupport:3.6.0')

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
