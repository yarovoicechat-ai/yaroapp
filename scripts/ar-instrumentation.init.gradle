// Test-only install of the SAME app sources under an isolated ID. Does not replace the user's installed Yaro app.
gradle.beforeProject { project ->
  project.plugins.withId('com.android.application') {
    project.androidComponents.finalizeDsl { android ->
      android.defaultConfig.applicationId = 'yaro.vc.app.arqa'
      android.defaultConfig.testApplicationId = 'yaro.vc.app.arqa.test'
      android.defaultConfig.testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
    }
    project.dependencies.add('androidTestImplementation', 'androidx.test:runner:1.6.2')
    project.dependencies.add('androidTestImplementation', 'androidx.test.ext:junit:1.2.1')
    project.tasks.configureEach { task ->
      if (task.name == 'processDebugGoogleServices') task.enabled = false
    }
  }
}
